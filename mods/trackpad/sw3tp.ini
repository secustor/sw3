; sw3tp.ini: settings of the sw3tp trackpad mod. Read once at game start.
; Missing keys use the defaults shown here. Reference: README.md, section "sw3tp.ini".
[sw3tp]
enabled=1
patch_at=dllmain
unixlib_forms=path
monitor=1
monitor_dispatch=0
hook_b=1
hook_c=1
flight_states=3,7,8,9,10,27
precise_is_trackpad=1
wheel_hold_ticks=3
aggressive_mod=ctrl
action_group_mask=8
altitude_restore_cursor=1
exec_cfg=Data\GUI\trackpad.cfg
debug_keys=0
trace_events=0

[gains]
kz=25
kr=0.1
ks=1.5
kp=1.0
ka=1.0
km=0.5
kmy=0.5

[thresholds]
rotate=3
magnify=0.03
scroll=4
altitude_min_dy=3
watchdog_ms=500
tap_max_ms=250
double_tap_ms=500
agg_cooldown_ms=400
synth_max_ms=1500

[features]
pinch_zoom=1
scroll_orbit=1
rotate_yaw=1
shift_scroll_altitude=1
option_scroll_pan=1
map_scroll_pan=1
force_click_focus=1
smart_magnify_switch_camera=1
aggressive_double_tap=1
modifier_resync=1

; Traffic hook module (mods/traffic). enabled=0 leaves the game untouched.
; site_*=0 skips one hook (tests only); tick_ms: real-time interval of TRF_OnTick; log=0 drops TRF_Log and per-hook lines.
; traceback=1: C _ERRORMESSAGE logs Lua errors with a stack trace (event=lua_error); stack_guard=1: T4 drops leaked Lua stack slots.
; carcasses=1: the TRF_Carcasses object list answers (0: registered, returns nil, "off"; mods/traffic/pe/API.md).
; trig_log=1: trigger-fire sampler (hooks T5a/T5b/T6; event=trig_fires, event=trig_frame; mods/traffic/README.md).
[traffic]
enabled=0
site_t1=1
site_t2a=1
site_t2b=1
site_t2c=1
site_t2d=1
site_t3=1
site_t4=1
tick_ms=250
log=1
traceback=1
stack_guard=1
carcasses=0
trig_log=0

; Game resolution (mods/performance). At start, sets gr_init_resolution in default.cfg
; (backup: default.cfg.sw3tp-orig). mode=off: untouched; auto: main display size; fixed: fixed=WxH.
; auto does nothing below min and scales a display above max down (same aspect, even sides).
; keep_bpp: bits per pixel written (0 keeps the file's); fullscreen: TRUE or FALSE; log=0: only changes and errors.
; render_scale: mtld3d render.scale via MTLD3D_CONFIG; auto: about 1680x1050 pixels of rendering, or 0.01..1.0, or off.
[display]
mode=off
fixed=
min=1024x768
max=4096x4096
keep_bpp=32
fullscreen=TRUE
render_scale=off
log=1

[stability]
; render lost-device guard: skip the scene render while the quad batch is freed (engine crash 0x432500 on app deactivation)
enabled=1
render_lost_guard=1
log=1

[view]
; mesh pass cull (call at 0x40c9dc in 0x40c890); performance README "View: frustum and size cull"
enabled=1
; frustum_cull: skip meshes the engine's own frustum test put outside the view (the pass discards that result)
frustum_cull=1
; size_cull: skip meshes whose projected diameter r*m11*H/d is below min_pixels (0.5..16)
size_cull=0
min_pixels=2.0
; meshes with world radius >= keep_radius are never size-culled (portal rings 11.8/15, station cores)
keep_radius=10
; 1: attach line and one stats line every 5 s; 2: also the first 20 culled meshes
log=1
