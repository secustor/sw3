; sw3tp.ini: settings of the sw3tp trackpad mod. Read once at game start.
; Missing keys use the defaults shown here. Reference: README.md, section "sw3tp.ini".
[sw3tp]
enabled=1
patch_at=dllmain
unixlib_forms=path
monitor=1
monitor_dispatch=0
hook_b=1
hook_c=1
flight_states=3,7,8,9,10,27
precise_is_trackpad=1
wheel_hold_ticks=3
aggressive_mod=ctrl
action_group_mask=8
altitude_restore_cursor=1
exec_cfg=Data\GUI\trackpad.cfg
debug_keys=0
trace_events=0

[gains]
kz=25
kr=0.1
ks=1.5
kp=1.0
ka=1.0
km=0.5
kmy=0.5

[thresholds]
rotate=3
magnify=0.03
scroll=4
altitude_min_dy=3
watchdog_ms=500
tap_max_ms=250
double_tap_ms=500
agg_cooldown_ms=400

[features]
pinch_zoom=1
scroll_orbit=1
rotate_yaw=1
shift_scroll_altitude=1
option_scroll_pan=1
map_scroll_pan=1
force_click_focus=1
smart_magnify_switch_camera=1
aggressive_double_tap=1

; Traffic hook module (mods/traffic). enabled=0 leaves the game untouched.
; site_*=0 skips one hook (tests only); tick_ms: real-time interval of TRF_OnTick; log=0 drops TRF_Log and per-hook lines.
[traffic]
enabled=0
site_t1=1
site_t2a=1
site_t2b=1
site_t2c=1
site_t2d=1
site_t3=1
site_t4=1
tick_ms=250
log=1
